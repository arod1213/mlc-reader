[package]
name = "mlc-reader"
version = "0.1.5"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
dirs = "6.0.0"
dotenv = "0.15.0"
libsql = "0.9.30"
serde = {version = "1.0.228", features=["derive"]}
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
ssh2 = "0.9.5"
num_enum = "0.7.6"
musicmeta = { git = "https://github.com/arod1213/musicmeta.git", version = "0.1.19" }
chrono = { version = "0.4.45", features = ["serde"] }
strum = "0.28.0"
