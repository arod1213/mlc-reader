[profile.dev]
debug = false
lto = "off"
opt-level = 0

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1

[package]
name = "mlc-reader"
version = "0.1.22"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
dirs = "6.0.0"
dotenv = "0.15.0"
serde = {version = "1.0.228", features=["derive"]}
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
ssh2 = "0.9.5"
num_enum = "0.7.6"
musicmeta = { git = "ssh://git@github.com/arod1213/musicmeta.git", version = "0.1.3" }
chrono = { version = "0.4.45", features = ["serde"] }
strum = "0.28.0"
env_logger = "0.11.10"
log = "0.4.32"
tower-http = { version = "0.7.1", features = ["cors"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
rusqlite = "^0.41"
